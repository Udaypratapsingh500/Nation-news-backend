spring.application.name=nation-news-backend

# Database
spring.datasource.url=jdbc:mysql://localhost:3306/nation_news?createDatabaseIfNotExist=true&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=Root@12345
# JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Server
server.port=8080

logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.orm=DEBUG
logging.level.org.springframework.orm.jpa=DEBUG
file.upload-dir=uploads
logging.level.org.springframework.security=TRACE